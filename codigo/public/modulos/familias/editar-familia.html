<!DOCTYPE html>
<html lang="pt-br">
 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Família</title>
 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../../assets/css/cadastro-familias.css">
    <link rel="stylesheet" href="../../assets/css/editar-familia.css">
    <link rel="stylesheet" href="../../assets/css/styles.css">
    <link rel="icon" type="image/x-icon" href="../../assets/images/icon_site.png">
</head>
 
<body>
    <header class="headerMobile">
        <nav class="navbar navbar-dark bg-dark navbarMobile">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="../../assets/images/logo_site.jpeg" alt="Logo" class="d-inline-block align-text-center">
                    <span style="color: #003CA3;">Guia-</span><span style="color: #2B7F3A">Benefício</span>
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </div>
        </nav>
        <div class="collapse" id="navbarToggleExternalContent" data-bs-theme="dark">
            <nav class="botoesNavegacao">
                <a class="link-header" href="../inicio/index.html">Início</a>
                <a class="link-header" href="../familias/familias.html">Famílias</a>
                <a class="link-header" href="../familias/cadastro-familias.html">Cadastrar Família</a>
                <a class="link-header" href="">Login</a><!-- Tem que linkar com a página de Login -->
            </nav>
        </div>
    </header>
 
    <header class="headerDesktop">
        <nav class="navbar navbar-dark navbarDesktop">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="../../assets/images/logo_site.jpeg" alt="Logo" class="d-inline-block align-text-center">
                    <span style="color: #003CA3;">Guia-</span><span style="color: #2B7F3A">Benefício</span>
                </a>
                <nav class="botoesNavegacao">
                    <a class="link-header" href="../inicio/index.html">Início</a>
                    <a class="link-header" href="../familias/familias.html">Famílias</a>
                    <a class="link-header" href="../familias/cadastro-familias.html">Cadastrar Família</a>
                    <a class="botao-amarelo" href="">Login</a><!-- Tem que linkar com a página de Login -->
                </nav>
            </div>
        </nav>
    </header>
 
    <main class="mt-4">
        <section class="intro">
            <h1>Editar Família</h1>
            <p id="texto-status">Carregando dados da família...</p>
        </section>
 
        <form id="form-edicao" class="container mb-5">
 
            <input type="hidden" id="idFamiliaRecurso">
            <input type="hidden" id="idFamiliaCustom">
            <input type="hidden" id="idAssistenteAtual">
            <input type="hidden" id="fotoFamiliaAtual">
 
            <!-- DADOS DA FAMÍLIA -->
            <div class="card-dinamico">
                <h4>Dados da Família</h4>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Nome da Família *</label>
                        <input type="text" id="nome-familia" required>
                    </div>
                    <div class="form-group">
                        <label>Telefone *</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Renda Familiar (R$) *</label>
                        <input type="number" id="renda" step="0.01" min="0" required>
                    </div>
                </div>
                <div class="form-group">
                        <label>Foto da Família (Anexo)</label>
                        <input type="file" id="fotoFamiliaFile" accept="image/*">
                    </div>
                <div id="preview-foto-familia-container" style="margin-top: 10px;"></div>
            </div>
 
            <!-- ENDEREÇO -->
            <div class="card-dinamico">
                <h4>Endereço</h4>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Rua *</label>
                        <input type="text" id="rua" required>
                    </div>
                    <div class="form-group">
                        <label>Número *</label>
                        <input type="text" id="numero" required>
                    </div>
                    <div class="form-group">
                        <label>Bairro *</label>
                        <input type="text" id="bairro" required>
                    </div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label>Cidade *</label>
                        <input type="text" id="cidade" required>
                    </div>
                    <div class="form-group">
                        <label>Estado (UF) *</label>
                        <input type="text" id="estado" maxlength="2" required>
                    </div>
                    <div class="form-group">
                        <label>CEP *</label>
                        <input type="text" id="cep" placeholder="00000-000" required>
                    </div>
                </div>
            </div>
 
            <!-- BENEFÍCIOS DA FAMÍLIA -->
            <div class="card-dinamico">
                <div class="membro-header">
                    <h4>Benefícios da Família</h4>
                    <button type="button" class="btn btn-secondary btn-small" id="btn-add-beneficio-familia">+ Adicionar Benefício</button>
                </div>
                <div id="container-beneficios-familia"></div>
            </div>
 
            <!-- MEMBROS -->
            <div class="card-dinamico">
                <div class="membro-header">
                    <h4>Membros da Família</h4>
                    <button type="button" class="btn btn-secondary" id="btn-add-membro">+ Adicionar Membro</button>
                </div>
                <div id="container-membros"></div>
            </div>
 
            <div style="display: flex; gap: 10px; margin-top: 20px;">
                <button type="submit" class="botao-azul" style="flex: 1; border: none;">Salvar Alterações</button>
                <a href="../familias/familias.html" class="botao-azul" style="flex: 1; text-align: center; color: white; background-color: red;">Cancelar</a>
            </div>
        </form>
    </main>
 
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../assets/js/auth.js"></script>
    <script src="../../assets/js/editar-familia.js"></script>
</body>
 
</html>
