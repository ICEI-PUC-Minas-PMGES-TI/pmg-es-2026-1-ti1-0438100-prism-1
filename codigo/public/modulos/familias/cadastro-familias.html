<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Família - Guia-Benefício</title>
    <link rel="stylesheet" href="../../assets/css/cadastro-familias.css">
    <link rel="icon" type="image/x-icon" href="../../assets/images/icon_site.png">
</head>
<body>

    <main class="container">
        <div class="form-header">
            <h1>Cadastro de Nova Família</h1>
            <p>Preencha os dados abaixo para registrar a família e seus membros no sistema.</p>
        </div>

        <form id="form-cadastro">
            <fieldset>
                <legend>Informações da Família</legend>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="nomeFamilia">Nome da Família *</label>
                        <input type="text" id="nomeFamilia" required placeholder="Ex: Família Silva Santos">
                    </div>
                    <div class="form-group">
                        <label for="telefone">Telefone de Contato *</label>
                        <input type="text" id="telefone" required placeholder="(31) 99999-9999">
                    </div>
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label for="rendaFamiliar">Renda Familiar Mensal (R$) *</label>
                        <input type="number" id="rendaFamiliar" step="0.01" required placeholder="0.00">
                    </div>
                </div>
                <div class="form-group">
                    <label for="fotoFamiliaFile">Foto da Família (Anexo)</label>
                    <input type="file" id="fotoFamiliaFile" accept="image/*">
                </div>
            </fieldset>

            <fieldset>
                <legend>Endereço</legend>
                <div class="grid-3">
                    <div class="form-group grid-col-span-2">
                        <label for="rua">Rua/Logradouro *</label>
                        <input type="text" id="rua" required placeholder="Rua das Flores">
                    </div>
                    <div class="form-group">
                        <label for="numero">Número *</label>
                        <input type="text" id="numero" required placeholder="123">
                    </div>
                </div>
                <div class="grid-3">
                    <div class="form-group">
                        <label for="bairro">Bairro *</label>
                        <input type="text" id="bairro" required placeholder="Centro">
                    </div>
                    <div class="form-group">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" required placeholder="Belo Horizonte">
                    </div>
                    <div class="form-group">
                        <label for="estado">Estado (UF) *</label>
                        <input type="text" id="estado" maxlength="2" required placeholder="MG">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cep">CEP *</label>
                    <input type="text" id="cep" placeholder="30110-000" required>
                </div>
            </fieldset>

            <fieldset>
                <legend>Benefícios da Família (Coletivos)</legend>
                <p class="section-desc">Selecione os benefícios que são aplicados para a casa inteira.</p>
                <div id="container-beneficios-familia"></div>
                <button type="button" class="btn btn-secondary" id="btn-add-beneficio-familia">+ Adicionar Benefício Familiar</button>
            </fieldset>

            <fieldset>
                <legend>Membros da Família</legend>
                <div id="container-membros"></div>
                <button type="button" class="btn btn-success" id="btn-add-membro">+ Adicionar Novo Membro</button>
            </fieldset>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary" id="btn-salvar">Salvar Cadastro</button>
            </div>
        </form>
    </main>

    <script src="../../assets/js/cadastro-familias.js"></script>
</body>
</html>
