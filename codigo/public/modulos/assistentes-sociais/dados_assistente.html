<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guia-Benefício – Meu Perfil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../../assets/css/dados_assistente.css" />
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>

<body>

  <header class="headerMobile">
    <nav class="navbar navbar-dark bg-dark navbarMobile">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="../../assets/images/logo_site.jpeg" alt="Logo" class="d-inline-block align-text-center">
          <span style="color: #003CA3;">Guia-</span><span style="color: #2B7F3A">Benefício</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
          data-bs-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent"
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </nav>
    <div class="collapse" id="navbarToggleExternalContent" data-bs-theme="dark">
      <nav class="botoesNavegacao">
        <a class="link-header" href="../inicio/index.html">Início</a>
        <a class="link-header" href="../familias/familias.html">Famílias</a>
        <a class="link-header" href="../familias/cadastro-familias.html">Cadastrar Família</a>
        <a class="link-header" href="../login/login.html">Login</a><!-- Tem que linkar com a página de Login -->
      </nav>
    </div>
  </header>

  <header class="headerDesktop">
    <nav class="navbar navbar-dark navbarDesktop">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">
          <img src="../../assets/images/logo_site.jpeg" alt="Logo" class="d-inline-block align-text-center">
          <span style="color: #003CA3;">Guia-</span><span style="color: #2B7F3A">Benefício</span>
        </a>
        <nav class="botoesNavegacao">
          <a class="link-header" href="../inicio/index.html">Início</a>
          <a class="link-header" href="../familias/familias.html">Famílias</a>
          <a class="link-header" href="../familias/cadastro-familias.html">Cadastrar Família</a>
          <a class="botao-amarelo" href="../login/login.html">Login</a><!-- Tem que linkar com a página de Login -->
        </nav>
      </div>
    </nav>
  </header>

  <div class="edit-banner" id="editBanner">
    <div class="edit-dot"></div>
    Modo de edição ativo — alterações ainda não salvas
  </div>

  <main>

    <div class="page-header">
      <h1>Meu Perfil</h1>
      <div class="page-divider"></div>
    </div>

    <div class="profile-card">

      <div class="card-top">
        <div class="avatar-wrap">
          <div class="avatar" id="avatarEl">
            <img src="" alt="Foto" id="avatarImg" style="display:none;" />
            <span id="avatarInitials">?</span>
          </div>
          <label class="btn-foto" id="btnFoto" style="display:none;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" y1="3" x2="12" y2="15" />
            </svg>
            Trocar foto
            <input type="file" id="inputFoto" accept="image/*" style="display:none;" />
          </label>
        </div>
        <div class="card-top-info">
          <h2 id="headerName">—</h2>
          <span class="badge-cargo">Assistente Social</span>
        </div>
      </div>

      <div class="card-body-custom">

        <p class="section-label">Informações pessoais</p>

        <div class="fields-grid">

          <div class="field-group full">
            <label>Nome completo</label>
            <div class="field-display" id="display-nome">—</div>
            <input class="field-input" id="input-nome" type="text" placeholder="Nome completo" style="display:none;" />
          </div>

          <div class="field-group">
            <label>E-mail</label>
            <div class="field-display" id="display-email">—</div>
            <input class="field-input" id="input-email" type="email" placeholder="E-mail" style="display:none;" />
          </div>

          <div class="field-group">
            <label>Telefone</label>
            <div class="field-display" id="display-telefone">—</div>
            <input class="field-input" id="input-telefone" type="text" placeholder="(00) 00000-0000"
              style="display:none;" />
          </div>

          <div class="field-group senha-centrada">
            <label>Senha</label>
            <div class="field-display" id="display-senha">••••••</div>
            <input class="field-input" id="input-senha" type="password" placeholder="Deixe em branco para não alterar"
              style="display:none;" />
          </div>

        </div>

        <p class="section-label">CRAS responsável</p>

        <div class="field-group" style="margin-bottom: 2rem;">
          <label>Unidade CRAS</label>

          <div class="field-display cras-display" id="display-cras">
            <span class="cras-pin"></span>
            <span id="cras-text">—</span>
          </div>

          <div id="roletaWrapper" style="display:none;">
            <div class="roleta-container">
              <div class="roleta-overlay roleta-overlay-top"></div>
              <div class="roleta-viewport" id="roletaViewport">
                <div class="roleta-track" id="roletaTrack"></div>
              </div>
              <div class="roleta-overlay roleta-overlay-bottom"></div>
              <div class="roleta-selector"></div>
            </div>
            <p class="roleta-hint">Role o mouse ou arraste para selecionar</p>
          </div>
        </div>
        <div class="action-bar" id="actionBar">
          <button class="btn-outline" id="btnEditar">Editar perfil</button>
        </div>
        <div class="action-bar" id="editActions" style="display:none;">
          <button class="btn-danger-custom" id="btnCancelar">Cancelar</button>
          <button class="btn-primary-custom" id="btnSalvar">Salvar alterações</button>
        </div>

      </div>
    </div>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../assets/js/auth.js"></script>
  <script src="../../assets/js/dados_assistente.js"></script>
</body>

</html>
