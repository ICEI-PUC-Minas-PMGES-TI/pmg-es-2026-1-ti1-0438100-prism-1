<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/beneficios-recomendados.css">
</head>

<body>
    <header class="bg-light shadow-sm py-2 px-3 d-flex justify-content-between align-items-center">
        <section class="logo d-flex align-items-center gap-2">
            <img src="assets/images/logo_site.jpeg" alt="Logo Guia-Benefício" style="max-height: 40px;">
            <h1 class="m-0 fs-4"><span style="color: #003CA3;">Guia-</span><span style="color: #2B7F3A">Benefício</span></h1>
            <button class="botao-menu">☰</button>
        </section>
        
        <nav>
            <a class="botao-azul" href="index.html">Início</a>
            <a class="botao-branco" href="">Benefícios</a>
            <a class="botao-branco" href="">Recomendador</a>
        </nav>
    </header>
    
    <main>
        <section class="intro">
            <h1>Benefícios Recomendados</h1>
            <p>Encontramos X benefícios com base no seu perfil. Clique em cada um para saber mais sobre como solicitar.</p>
        </section>
<section class="controles">
            <div class="barra-pesquisa">
                <input type="text" placeholder="Digite o nome de um benefício...">
                <button class="btn-pesquisa" aria-label="Pesquisar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                </button>
            </div>
            
            <div class="ordenacao">
                <label for="ordenar">Ordenar por:</label>
                <select id="ordenar">
                    <option value="padrao">Padrão</option>
                    <option value="maior-valor">Maior Valor</option>
                    <option value="menor-valor">Menor Valor</option>
                </select>
            </div>
        </section>
        <section class="beneficios">
            
        </section>
    </main>
    
    <script src="assets/js/beneficios-recomendados.js"></script>
</body>

</html>
